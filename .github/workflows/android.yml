name: Android

on:
  push:
    branches: [main, "phase-*"]
    paths-ignore: ["web/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + R8 release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle deps and wrapper; only main writes the cache so PRs can't poison it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/phase-') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: APK size and permission check
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c %s "$apk")
          mb=$(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }")
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions "$apk")
          {
            echo "### Release APK"
            echo "| | |"
            echo "|---|---|"
            echo "| Size | **${mb} MB** (${bytes} bytes) |"
            echo "| Budget | 40 MB |"
            echo
            echo '```'
            echo "$perms"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # v1 is fully on-device (CLAUDE.md): fail if INTERNET ever sneaks in via a dependency.
          if echo "$perms" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK requests INTERNET permission"; exit 1
          fi
          # details.md §3 budget.
          if [ "$bytes" -gt $((40 * 1024 * 1024)) ]; then
            echo "::error::APK is ${mb} MB, over the 40 MB budget"; exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: qiap-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Debug build has the FPS/inference readout and the fixture recorder for on-device tuning.
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qiap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
