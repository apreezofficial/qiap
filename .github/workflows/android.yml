name: Android

on:
  push:
    branches: [main, "phase-*"]
    paths-ignore: ["web/**", "**.md"]
  pull_request:
    paths-ignore: ["web/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + R8 release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle deps and wrapper; only main writes the cache so PRs can't poison it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/phase-') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: APK size and permission check
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c %s "$apk")
          mb=$(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }")
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions "$apk")
          {
            echo "### Release APK"
            echo "| | |"
            echo "|---|---|"
            echo "| Size | **${mb} MB** (${bytes} bytes) |"
            echo "| Budget | 40 MB |"
            echo
            echo '```'
            echo "$perms"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # v1 is fully on-device (CLAUDE.md): fail if INTERNET ever sneaks in via a dependency.
          if echo "$perms" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK requests INTERNET permission"; exit 1
          fi
          # details.md §3 budget.
          if [ "$bytes" -gt $((40 * 1024 * 1024)) ]; then
            echo "::error::APK is ${mb} MB, over the 40 MB budget"; exit 1
          fi


      # details.md Phase 6 "APK size audit": what is actually in the APK, biggest first.
      - name: APK size breakdown
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          {
            echo "### What's in the release APK (largest 15, compressed bytes)"
            echo '```'
            unzip -v "$apk" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $3, $8}' | sort -nr | head -15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: qiap-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Debug build has the FPS/inference readout and the fixture recorder for on-device tuning.
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qiap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Play takes bundles, not APKs. Signed with the upload key when the secrets exist (see
      # docs/RELEASE.md); otherwise signed with the debug key, which Play will reject.
      - name: Release bundle (AAB)
        env:
          KEYSTORE_B64: ${{ secrets.QIAP_KEYSTORE_B64 }}
          QIAP_KEYSTORE_PASSWORD: ${{ secrets.QIAP_KEYSTORE_PASSWORD }}
          QIAP_KEY_ALIAS: ${{ secrets.QIAP_KEY_ALIAS }}
          QIAP_KEY_PASSWORD: ${{ secrets.QIAP_KEY_PASSWORD }}
          QIAP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export QIAP_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            echo "AAB signed with the upload key (version code $QIAP_VERSION_CODE)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No upload-key secrets set. The AAB is debug-signed and cannot be uploaded to Play."
            echo "AAB is debug-signed (no upload key secrets). Not for the store." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./gradlew :app:bundleRelease --console=plain

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: qiap-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
